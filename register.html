<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create account · CUNNACT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b57e6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">
      <strong>CUNNACT</strong>
      <span>Stay Connected.</span>
    </div>
    <h1>Create account</h1>
    <p>Join CUNNACT and start connecting.</p>
    <form id="registerForm" novalidate>
      <label>Name
        <input id="name" type="text" autocomplete="name" required>
      </label>
      <label>Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input id="password" type="password" minlength="6" autocomplete="new-password" required>
      </label>
      <label>Confirm password
        <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      </label>
      <button type="submit" class="btn btn-primary">Create account</button>
      <p id="authError" class="error" role="alert" aria-live="polite"></p>
    </form>
    <p class="switch">Already registered? <a href="login.html">Login</a></p>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
