<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create account · CUNNACT</title>
<link rel="icon" href="assets/brand/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/cunnact-32.png"><link rel="apple-touch-icon" href="assets/icons/cunnact-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script>document.documentElement.dataset.theme = localStorage.getItem("cunnact_theme") === "dark" ? "dark" : "light";</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0F172A"></head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <img class="theme-logo-light auth-wordmark-logo" src="assets/brand/cunnact-logo.svg" alt="CUNNACT — Stay Connected" loading="eager">
      <img class="theme-logo-dark auth-wordmark-logo" src="assets/brand/cunnact-logo-light.svg" alt="CUNNACT — Stay Connected" loading="eager">
    </div>
    <h1>Create account</h1>
    <p>Join CUNNACT and start connecting.</p>
    <form id="registerForm" novalidate>
      <label>Name
        <input id="name" type="text" autocomplete="name" required>
      </label>
      <label>Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input id="password" type="password" minlength="6" autocomplete="new-password" required>
      </label>
      <label>Confirm password
        <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      </label>
      <button type="submit" class="btn btn-primary">Create account</button>
      <p id="authError" class="error" role="alert" aria-live="polite"></p>
    </form>
    <p class="switch">Already registered? <a href="login.html">Login</a></p>
    <footer class="auth-footer">
      <span>CUNNACT by <a href="https://hackwithas.in" target="_blank" rel="noopener noreferrer">HackWithAS</a></span>
    </footer>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
