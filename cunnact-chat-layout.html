<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUNNACT Chat Layout</title>
<style>
:root{--bg:#F4F5F7;--sf:#fff;--s2:#F0F2F5;--bd:#E3E6EB;--tx:#11131A;--t2:#626A79;--ac:#5B57E6;--acs:#EEEDFF;--dn:#DC4F52;--in:#fff;--wp:rgba(91,87,230,.07)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B0D11;--sf:#111419;--s2:#1C2027;--bd:rgba(255,255,255,.09);--tx:#F5F7FB;--t2:#AAB2C2;--ac:#8B88FF;--acs:#22233f;--in:#1C2027;--wp:rgba(255,255,255,.035)}}
:root[data-theme=dark]{--bg:#0B0D11;--sf:#111419;--s2:#1C2027;--bd:rgba(255,255,255,.09);--tx:#F5F7FB;--t2:#AAB2C2;--ac:#8B88FF;--acs:#22233f;--in:#1C2027;--wp:rgba(255,255,255,.035)}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit}
#app{display:flex;height:100%}
#rail{width:68px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rb{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--t2);display:grid;place-items:center;cursor:pointer}
.rb:hover{background:var(--s2)}.rb.on{background:var(--acs);color:var(--ac)}
.rb .av{width:34px;height:34px;font-size:14px}
.bd{position:absolute;top:0;right:0;background:var(--ac);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
#side{width:390px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-width:0}
.hd{display:flex;align-items:center;gap:6px;padding:16px 16px 8px}
.hd h2{flex:1;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ib{width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--s2)}.ib.ac{background:var(--ac);color:#fff}
.sr{margin:6px 16px;display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:22px;padding:0 14px;height:42px;color:var(--t2)}
.sr input{flex:1;border:0;background:none;outline:0;color:var(--tx);font:inherit;min-width:0}
.ch{display:flex;gap:8px;padding:8px 16px}
.chip{border:1px solid var(--bd);background:none;color:var(--t2);border-radius:18px;padding:5px 12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--acs);color:var(--ac);border-color:transparent}
.ls{flex:1;overflow:auto;padding:0 8px}
.sec{padding:14px 12px 4px;font-weight:700}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;cursor:pointer}
.row:hover,.row.on{background:var(--s2)}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 18px/1 Inter,system-ui,sans-serif;font-style:normal}
.ring{padding:2px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6,#06B6D4)}.ring .av{width:44px;height:44px;border:2px solid var(--sf)}
.m{flex:1;min-width:0}.r1,.r2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.r1 b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r1 small{color:var(--t2);font-size:12px}
.r2{color:var(--t2);font-size:13px}.r2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u{background:var(--ac);color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;font-size:11px;font-weight:700;display:grid;place-items:center}
.gi{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.mh{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
.mh .row{padding:0;flex:1;min-width:0}.mh .av{width:42px;height:42px;font-size:16px}
.bk{display:none}
#msgs{flex:1;overflow:auto;padding:16px 7%;display:flex;flex-direction:column;gap:8px;background-image:radial-gradient(var(--wp) 1.6px,transparent 1.6px);background-size:22px 22px}
.b{position:relative;max-width:66%;padding:7px 10px 5px;border-radius:14px 14px 14px 4px;background:var(--in);align-self:flex-start;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.b.out{align-self:flex-end;border-radius:14px 14px 4px 14px;background:linear-gradient(135deg,#5B57E6,#8B5CF6);color:#fff}
.b .t{font-size:11px;opacity:.7;margin-left:12px;float:right;margin-top:6px}
.q{border-left:3px solid #06B6D4;background:rgba(127,127,127,.18);padding:4px 8px;border-radius:6px;margin-bottom:4px;font-size:12px}
.sn{font-size:12px;font-weight:700;color:var(--ac)}
.rx{position:absolute;bottom:-13px;right:8px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:0 5px;font-size:12px;color:var(--tx)}
.dd{position:absolute;top:3px;right:3px;display:none;width:22px;height:22px;border:0;border-radius:50%;background:rgba(127,127,127,.3);color:inherit;place-items:center;cursor:pointer}
.b:hover .dd{display:grid}
@media(hover:none){.dd{display:grid;opacity:.6}}
.cp{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--sf);border-top:1px solid var(--bd)}
.cp input{flex:1;height:44px;border-radius:22px;border:0;background:var(--s2);padding:0 16px;color:var(--tx);font:inherit;outline:0;min-width:0}
.em{margin:auto;text-align:center;color:var(--t2);padding:24px}.em h3{color:var(--tx);font-size:26px;font-weight:800;margin:10px 0 4px}
.cbs{display:flex;gap:22px;justify-content:center;margin-top:28px;flex-wrap:wrap}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--tx);cursor:pointer}
.cb i{width:56px;height:56px;border-radius:50%;background:var(--s2);display:grid;place-items:center}
#info{width:340px;background:var(--sf);border-left:1px solid var(--bd);overflow:auto;display:none}
.io #info{display:block}
.pp{position:fixed;z-index:30;background:var(--sf);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 32px rgba(0,0,0,.28);padding:6px;min-width:210px}
.pi{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.pi:hover{background:var(--s2)}.pi.dn{color:var(--dn)}
.pp hr{border:0;border-top:1px solid var(--bd);margin:4px 8px}
.rbar{display:flex;gap:10px;font-size:22px;padding:6px 10px}.rbar span,.eg span{cursor:pointer}
.eg{display:grid;grid-template-columns:repeat(8,1fr);font-size:24px;text-align:center;max-height:210px;overflow:auto;margin-top:8px}
.tabs{display:flex;justify-content:space-around;padding:6px;color:var(--t2)}
.pf{display:flex;flex-direction:column;align-items:center;padding:8px 16px 16px;text-align:center}
.pf h3{font-size:22px;margin:12px 0 2px}.pf p{color:var(--t2)}
.ft{display:inline-block;background:var(--acs);color:var(--ac);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:auto}
.card{background:var(--in);border-radius:14px;padding:8px;max-width:520px;align-self:center;width:100%;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.card .im{height:180px;border-radius:10px;background:linear-gradient(135deg,#3B82F6,#8B5CF6,#06B6D4)}
.chp{display:inline-flex;gap:6px;background:var(--s2);border-radius:12px;padding:2px 10px;margin:6px 6px 0 0;font-size:13px}
.dv{align-self:center;background:var(--sf);border-radius:10px;padding:3px 12px;font-size:12px;color:var(--t2)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(8,9,14,.95);color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ov .top{display:flex;align-items:center;gap:8px;padding:12px 16px}.ov .ib{color:#fff}.ov .ib:hover{background:rgba(255,255,255,.12)}
.ov .bg{flex:1;margin:0 auto 16px;width:min(560px,94vw);border-radius:16px;display:grid;place-items:center;text-align:center;padding:24px;font-size:30px;font-weight:800;position:relative;overflow:hidden}
.pbs{display:flex;gap:4px;padding:10px 16px 0;width:min(592px,100%);margin:0 auto}.pb{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}.pb i{display:block;height:100%;background:#fff}.pb i.go{animation:pg 5s linear}.pb i.z{width:0}
@keyframes pg{from{width:0}}
.ov .rp{display:flex;gap:8px;padding:0 16px 16px;width:min(592px,100%);margin:0 auto}.ov .rp input{flex:1;height:44px;border-radius:22px;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;padding:0 16px;font:inherit;outline:0}
.im2{height:170px;width:min(260px,60vw);border-radius:10px;background:linear-gradient(135deg,#06B6D4,#5B57E6);margin-bottom:4px;cursor:pointer;display:grid;place-items:center;color:#fff}
.b.big{background:none;box-shadow:none;font-size:44px;color:var(--tx)}
.sel .b{cursor:pointer}.sel .dd{display:none!important}.sel .im2{pointer-events:none}.b.on{outline:2px solid var(--ac)}
.b.on::before{content:'✓';position:absolute;left:-26px;top:50%;transform:translateY(-50%);background:var(--ac);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:grid;place-items:center}
.gif{height:80px;border-radius:8px;cursor:pointer}
@media(max-width:820px){
#app{flex-direction:column-reverse}
#rail{width:100%;height:58px;flex-direction:row;justify-content:space-around;padding:0;border-right:0;border-top:1px solid var(--bd)}
#rail span{display:none}
#side{width:100%;flex:1;border-right:0;min-height:0}
#main{display:none}
.co #rail,.co #side{display:none}.co #main{display:flex;flex:1;min-height:0}
.bk{display:grid}.b{max-width:85%}#msgs{padding:12px}
.io #info{position:fixed;inset:0;width:100%;z-index:25;padding-top:env(safe-area-inset-top,0px)}
}
</style></head>
<body>
<div id="app"><nav id="rail"></nav><aside id="side"></aside><main id="main"></main><aside id="info"></aside></div>
<script>
const $=s=>document.querySelector(s);
const P={chat:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',status:'<circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/><circle cx="12" cy="12" r="3.5"/>',radio:'<circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',video:'<path d="m22 8-6 4 6 4V8z"/><rect x="2" y="6" width="14" height="12" rx="2"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',more:'<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',plus:'<path d="M12 5v14M5 12h14"/>',back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',clip:'<path d="m21.4 11-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>',smile:'<circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/>',send:'<path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>',reply:'<path d="M9 17l-5-5 5-5M20 18v-2a4 4 0 0 0-4-4H4"/>',copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',forward:'<path d="m15 17 5-5-5-5M4 18v-2a4 4 0 0 1 4-4h12"/>',pin:'<path d="M12 17v5M8 3h8l-1 7 3 3v4H6v-4l3-3z"/>',bookmark:'<path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/>',check:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',bellx:'<path d="M13.7 21a2 2 0 0 1-3.4 0M18.6 13A17 17 0 0 1 18 8a6 6 0 0 0-9.3-5M6.3 6.3A6 6 0 0 0 6 8c0 7-3 9-3 9h14M2 2l20 20"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>',down:'<path d="m6 9 6 6 6-6"/>',dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/>',camera:'<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',head:'<path d="M3 18v-6a9 9 0 0 1 18 0v6M21 19a2 2 0 0 1-2 2h-1v-7h3zM3 19a2 2 0 0 0 2 2h1v-7H3z"/>',user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',userp:'<path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>',poll:'<path d="M18 20V10M12 20V4M6 20v-6"/>',cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',link:'<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',grid:'<path stroke-width="3" d="M5 5h.01M12 5h.01M19 5h.01M5 12h.01M12 12h.01M19 12h.01M5 19h.01M12 19h.01M19 19h.01"/>',ban:'<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const av=(n,s=48)=>`<i class="av" style="width:${s}px;height:${s}px;font-size:${s*.38}px;background:hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360} 50% 42%)">${n[0]}</i>`;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hd=(t,x='')=>`<div class="hd"><h2>${t}</h2>${x}</div>`;
const ib=(i,a='x',c='')=>`<button class="ib ${c}" data-a="${a}">${ic(i)}</button>`;
const sr=(p,id='')=>`<label class="sr">${ic('search',18)}<input id="${id}" placeholder="${p}"></label>`;
const mi=(i,l,a='x',c='')=>`<div class="pi ${c}" data-a="${a}">${ic(i,18)}${l}</div>`;
const CH=[{n:'Aarav (You)',p:'Story lagane pe tap kar…',t:'4:52 pm',pin:1},{n:'B.Tech CSE 5th-D',p:'~Riya added Kabir',t:'Tuesday',g:1,pin:1,u:3},{n:'Kabir Singh',p:'Kha h',t:'2:52 pm'},{n:'HDFC Bank',p:'Account Balance Update…',t:'11:51 am',u:3},{n:'Papa Ji',p:'✓✓ Ok',t:'11:27 am',f:1},{n:'Meera Sharma',p:'Video call',t:'10:55 am',f:1},{n:'Rohan Verma',p:'✓✓ https://cunnact.vercel.app/',t:'10:00 am'},{n:'King Squad',p:'Ansh was added',t:'25/07/2026',g:1},{n:'Subek Rana',p:'✓✓ app-release.apk',t:'Yesterday',u:1}];
const MS=[{o:0,x:'Hn toh pese toh lekr aungi hi',q:'Nhi hoti h',t:'9:04 pm'},{o:1,x:'mujhe lga bta du',t:'9:05 pm'},{o:0,x:'Achha',t:'9:06 pm',r:'😂'},{o:1,x:'me website me upgrade karte karte khud me upgrade na kar du',t:'9:07 pm'},{o:0,x:'Website me hi kro abhi tum 😂',q:'me website me upgrade karte karte…',t:'9:08 pm'},{o:1,x:'hmm',t:'9:08 pm'},{o:1,x:'https://cunnact.vercel.app/',t:'9:10 pm'},{o:0,img:1,x:'Ye dekh 👀',t:'9:12 pm'}];
const R=['👍','❤️','😂','😮','😢','🙏'],EM=[...'😀😃😄😁😆😅😂🤣🥲😊😇🙂😉😌😍🥰😘😗😋😛😜🤪🤨🧐🤓😎🥳😏😒😞😔😟😕🙁😣😖😫😩🥺😢😭😤😠😡🤬🤯😳🥵🥶😱😨😰😥😓🤗🤔🤭🤫👍🙏🔥🎉'];
const S={v:'chats',c:null,f:'All',q:'',io:0,ch:null,mi:0};
const NAV=[['chats','chat'],['calls','phone'],['status','status'],['channels','radio'],['comm','users']];
const now=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function rail(){$('#rail').innerHTML=NAV.map(([k,i])=>`<button class="rb ${S.v==k?'on':''}" data-a="v:${k}">${ic(i,22)}${k=='chats'?'<b class="bd">91</b>':''}</button>`).join('')+'<span style="flex:1"></span>'+`<button class="rb" data-a="th">${ic('moon',22)}</button><button class="rb ${S.v=='set'?'on':''}" data-a="v:set">${av('Aarav')}</button>`}
