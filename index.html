<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CUNNACT</title>
<meta name="description" content="CUNNACT — a modern, private one-to-one messaging app.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b57e6'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/chat.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="brand-mark">
          <strong>CUNNACT</strong>
          <span>Stay Connected.</span>
        </div>
      </div>

      <div class="current-user">
        <span class="avatar" id="currentUserAvatar">
          <img id="currentUserPhoto" alt="" hidden>
          <span class="avatar-fallback" id="currentUserInitials"></span>
          <span class="status-dot online"></span>
        </span>
        <div class="meta">
          <strong id="currentUserName">Guest</strong>
          <span id="currentUserStatus">Offline</span>
        </div>
      </div>

      <div class="search-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <label for="userSearch" class="sr-only">Search people</label>
        <input id="userSearch" type="search" placeholder="Search people...">
      </div>

      <div id="searchResults" class="list" role="listbox" aria-label="Search results"></div>

      <div class="section-title">Chats</div>
      <div id="chatList" class="list" role="listbox" aria-label="Conversations">
        <div class="empty-state">No conversations yet. Search for someone to start chatting.</div>
      </div>

      <div class="sidebar-actions">
        <button id="profileBtn" class="btn btn-ghost">Profile</button>
        <button id="logoutBtn" class="btn btn-ghost">Logout</button>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <button id="backBtn" class="icon-btn mobile-only" aria-label="Back to chats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span class="avatar" id="chatAvatar">
          <img id="chatPhoto" alt="" hidden>
          <span class="avatar-fallback" id="chatInitials"></span>
          <span class="status-dot" id="chatStatusDot"></span>
        </span>
        <div class="meta">
          <strong id="chatName">Select a conversation</strong>
          <span id="chatStatus">Start a new chat</span>
        </div>
      </header>

      <section id="messages" class="messages">
        <div class="welcome">
          <div class="logo-mark">C</div>
          <h1>Welcome to CUNNACT</h1>
          <p>Find someone and start a private conversation.</p>
        </div>
      </section>

      <div id="imagePreviewBar" class="image-preview-bar" hidden>
        <img id="imagePreviewThumb" alt="Selected image preview">
        <div class="preview-info">
          <span id="imagePreviewStatus" class="status-text">Ready to send</span>
          <div class="progress"><div id="imagePreviewProgress" class="progress-fill"></div></div>
        </div>
        <div class="actions">
          <button id="imagePreviewCancel" type="button" class="icon-btn" aria-label="Cancel image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <button id="imagePreviewSend" type="button" class="btn btn-primary">Send</button>
        </div>
      </div>

      <form id="messageForm" class="composer">
        <input id="fileInput" type="file" hidden accept="image/jpeg,image/png,image/webp,image/gif">
        <button id="attachBtn" type="button" class="icon-btn" disabled aria-label="Send an image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <label for="messageInput" class="sr-only">Type a message</label>
        <input id="messageInput" autocomplete="off" placeholder="Type a message..." disabled>
        <button type="submit" class="send-btn" disabled aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
